<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    라이즈 어드민 파비콘(P19) — 크림 둥근 사각형 타일 위 R 마크.
    지오메트리는 design/brand/rise-mark.svg(소스 오브 트루스)의 좌표를 그대로 옮겼다.
    마크 bbox x[116,304] y[110,304](획 포함) · 중심 (210,207) → scale 0.216으로 마크 높이가
    타일의 ~65%(41.9px), translate는 마크 중심을 (32,32)에 놓는 값(32 − 210·s, 32 − 207·s).
    rx 14 ≈ 22% — 마스터 아이콘(gen/appicon-master.png)과 같은 크림 타일 인상을 유지한다.
    마크를 고치면 rise-mark.svg를 먼저 고치고 이 파일의 path를 다시 복사할 것.
  -->
  <rect width="64" height="64" rx="14" fill="#F6F4EF"/>
  <g transform="translate(-13.36 -12.71) scale(0.216)">
    <g fill="none" stroke="#3B4C60" stroke-width="21.5" stroke-linecap="round">
      <path d="M 127,164 C 137,143 158,124 182,121 C 190,120 202,120 210,122
               C 232,127 249,138 257,155 C 263,167 265,180 262,196
               C 259,214 251,228 240,238 C 231,245 221,249 206,249"/>
      <path d="M 208,252 C 217,263 224,272 232,280 C 240,288 245,291 250,293"/>
      <path d="M 159.5,290 L 159.5,214 Q 159.5,195.5 178,195.5 L 190,195.5 Q 197,196 201,198.5"/>
    </g>
    <circle cx="287" cy="284.5" r="17" fill="#CEBBAA" stroke="none"/>
  </g>
</svg>

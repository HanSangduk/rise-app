<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 106 196 202">
  <!--
    라이즈 컨디셔닝 R 마크 (P19).

    출처: 브랜드 보드(rise.jpeg)의 R을 벡터로 재현한 것. JPEG 크롭이 아니라 재현인 이유 —
    원본에서 R은 200px 남짓이라 1024px 아이콘으로 5배 확대하면 뭉개진다.
    재현 방법: 원본을 headless Chrome 캔버스에 올려 획 가장자리를 픽셀 스캔 →
    센터라인·굵기(21.5px)·색을 수치로 추출 → 같은 좌표계에 스트로크로 작도 →
    원본 위에 55% 투명도로 겹쳐 오차를 눈으로 확인(3회 반복).
    좌표계가 원본 이미지 픽셀 좌표 그대로인 것은 그 재현 과정의 흔적이다.

    브랜드 색:
      네이비(획)  #3B4C60
      베이지(점)  #CEBBAA
      크림(배경)  #F6F4EF  (이 파일엔 없음 — 배경은 쓰는 쪽이 깐다)

    구성: 큰 열린 아치 + 안쪽 작은 r형 획 + 우하단 베이지 점. 셋의 상대 위치가 마크의
    정체성이므로 개별 요소를 따로 옮기지 말 것.
  -->
  <g fill="none" stroke="#3B4C60" stroke-width="21.5" stroke-linecap="round">
    <path d="M 127,164 C 137,143 158,124 182,121 C 190,120 202,120 210,122
             C 232,127 249,138 257,155 C 263,167 265,180 262,196
             C 259,214 251,228 240,238 C 231,245 221,249 206,249"/>
    <path d="M 208,252 C 217,263 224,272 232,280 C 240,288 245,291 250,293"/>
    <path d="M 159.5,290 L 159.5,214 Q 159.5,195.5 178,195.5 L 190,195.5 Q 197,196 201,198.5"/>
  </g>
  <circle cx="287" cy="284.5" r="17" fill="#CEBBAA"/>
</svg>
